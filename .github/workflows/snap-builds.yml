name: 🧪 Snap Builds

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Flutter
        run: |
          tool/get-flutter.sh "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Run the tests
        run: |
          flutter --disable-analytics
          flutter pub get --enforce-lockfile
          flutter test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build Snap
        uses: snapcore/action-build@v1
        id: build
        with:
          # Not "args": that input is silently ignored by the action now.
          snapcraft-args: pack

      # The .snap for installing by hand: `sudo snap install --dangerous <file>`.
      # Download it from the run's Summary page; it's zipped, so unzip first.
      # Before the review, so a build the review flags can still be looked at.
      # Nothing goes to the store here.
      - name: Upload Snap
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.snap }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
          retention-days: 14

      - name: Snapcraft Review
        uses: diddlesnaps/snapcraft-review-action@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          isClassic: 'false'
